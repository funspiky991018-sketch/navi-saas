<!DOCTYPE html>
<html>
<head>
  <title>NAVI V4</title>
</head>
<body>

<h2>NAVI Resume AI</h2>

<textarea id="resume" placeholder="Paste resume"></textarea><br>
<textarea id="job" placeholder="Paste job description"></textarea><br>

<button onclick="analyze()">Analyze</button>
<button onclick="fixResume()">Fix Resume</button>

<pre id="output"></pre>

<script>
const API = "https://navi-api-254r.onrender.com";

async function analyze(){
  const res = await fetch(API + "/analyze", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      resume: document.getElementById("resume").value,
      job: document.getElementById("job").value
    })
  });

  document.getElementById("output").textContent = await res.text();
}

async function fixResume(){
  const res = await fetch(API + "/fix-resume", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      resume: document.getElementById("resume").value
    })
  });

  document.getElementById("output").textContent = await res.text();
}
</script>

</body>
</html>
